server {
    listen 80 default_server;
    server_name _;
    root /var/www/html;
    index index.php index.html;
    client_max_body_size 100m;

    # 安全:禁止访问核心/数据目录与模板源码
    location ^~ /ky/ { deny all; return 404; }
    location ^~ /docker/ { deny all; return 404; }
    location ^~ /data/ { deny all; return 404; }
    location ~* ^/(theme|addon)/.*\.php$ { deny all; return 404; }
    location ~ /\. { deny all; return 404; }

    location / {
        try_files $uri $uri/ /index.php?s=$uri&$query_string;
    }

    location ~ \.php(/|$) {
        try_files $uri =404;
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 120;
    }

    # 静态资源缓存
    location ~* \.(css|js|png|jpg|jpeg|gif|webp|svg|woff2?)$ {
        expires 7d;
        access_log off;
    }
}
